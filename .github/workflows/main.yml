📲 GitHub Actions orqali APK Faylni Yaratish
Yuklab olingan atom_fizikasi_github_apk.zip arxivini oʻz GitHub repozitoriyangizga joylashtirishingiz bilan .github/workflows/main.yml skripti avtomatik ishga tushadi va bir necha daqiqada Android APK faylini tayyorlab beradi.

main yml kodini yozib ber



GitHub Actions orqali ilovani avtomatik ravishda Android APK (app-debug.apk) formatida yigʻish uchun moʻljallangan toʻliq main.yml fayli kodi:

Ushbu faylni GitHub repozitoriyangizda quyidagi yoʻl boʻyicha saqlang:
📁 .github/workflows/main.yml

YAML
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK 21 o'rnatish (Capacitor 6 va Gradle 8 uchun)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web fayllarni (www/index.html) tayyorlash
        run: |
          mkdir -p www
          if [ -f "atom_fizikasi_app.html" ] && [ ! -f "www/index.html" ]; then
            cp atom_fizikasi_app.html www/index.html
          elif [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          ls -la www/

      - name: package.json va capacitor.config.json yaratish
        run: |
          cat << 'EOF' > package.json
          {
            "name": "atom-fizikasi-pro",
            "version": "3.0.0",
            "description": "Atom Fizikasi - Mobil Ilova",
            "main": "www/index.html",
            "scripts": {
              "build": "echo 'Static build ready'"
            },
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "uz.tabiiyfanlar.atomfizikasi",
            "appName": "Atom Fizikasi",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Capacitor va Android platformani o'rnatish
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Gradle orqali APK faylni yig'ish (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tayyor APK faylni Artifacts bo'limiga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: AtomFizikasi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
💡 Foydalanish boʻyicha qisqa koʻrsatma:
Repozitoriyga joylash: Fayllarni GitHub repozitoriyangizning asosiy (main yoki master) tarmogʻiga yuboring (git push).

Avtomatik yigʻish: Kod yuklanishi bilan GitHub Actions oʻzi avtomatik ishga tushadi (taxminan 2–3 daqiqa davom etadi).

APK ni yuklab olish: Repozitoriyingizdagi Actions yorligʻiga kiring, oxirgi muvaffaqiyatli ishga tushgan Build Android APK jarayonini oching va pastdagi Artifacts qismidan AtomFizikasi-APK faylini yuklab oling.

 

"Veb tizimlari" faninidan daturladan yuqoridagi kabi mobil ilova

 

Mavzular

 

1.   Veb tizimlariga kirish Veb tizim tushunchasi.

Internet va World Wide Web. Veb server va veb brauzer. Veb tizimlarning

evolyutsiyasi: Web 1.0, Web 2.0, Web 3.0.

2.   Veb arxitekturasi  Client-server arxitekturasi.

HTTP protokoli asoslari (so‘rov va javob tuzilishi, metodlari: GET, POST, PUT,

DELETE). URL va URI. HTTP holatsizligi.

3.   HTML5 asoslari HTML tuzilishi: doctype, html,

head, body. Asosiy teglar: h1-h6, p, a, img, div, span. Semantik elementlar:

header, nav, section, article, footer. Formalar va input turlari.

4.   CSS3 asoslari CSS sintaksisi. Selektorlar

(element, class, id, attribute, pseudo-class). Box model (margin, border,

padding, content). Flexbox va Grid layout. Responsive dizayn (media queries).

5.   JavaScript asoslari JavaScript sintaksisi: o‘zgaruvchilar

(var, let, const), ma’lumot turlari, funksiyalar, shart operatorlari, sikllar.

DOM manipulyatsiyasi. Event listener. Async/await va Promise.

6.   Frontend frameworklar – React React

tushunchasi. Komponentli arxitektura. JSX sintaksisi. Props va state. Komponentlar hayotiy sikli (lifecycle). Hooks

(useState, useEffect, useContext).

7.   Backend texnologiyalari – Node.js va

Express Node.js tushunchasi (JavaScript runtime). npm (node package

manager). Express.js – minimal web framework. Routing. Middleware. Statik

fayllarni servis qilish.

8.   Ma’lumotlar bazalari – SQL va MongoDB 



Relyatsion ma’lumotlar bazalari (MySQL, PostgreSQL) – SQL so‘rovlari (SELECT,

INSERT, UPDATE, DELETE). NoSQL (MongoDB) – document-based, Collections va

Documents. SQL vs NoSQL solishtiruvi.

9.   RESTful API va GraphQL REST arxitekturasi

prinsiplari. API endpointlar. JSON format. CRUD amallari. Postman bilan API

test qilish. GraphQL – so‘rov tili, REST dan farqlari.

10.Autentifikatsiya va autorizatsiya 

Session-based vs Token-based (JWT). JWT (JSON Web Token) tuzilishi. Bcrypt –

parolni xeshlash. OAuth 2.0 va OpenID Connect asoslari. Social login.

11.Veb tizimlarda xavfsizlik . Keng tarqalgan

xavfsizlik zaifliklari: XSS (Cross-Site Scripting), CSRF (Cross-Site Request

Forgery), SQL Injection, XSS dan himoyalanish (sanitization). HTTPS va SSL/TLS.

12.Veb tizimlarni joylashtirish (deployment) . Veb

tizimni joylashtirish bosqichlari. Hosting turlari (shared, VPS, cloud).

Environment variables. CI/CD asoslari (GitHub Actions). Platformalar: Vercel,

Netlify, Heroku, AWS, DigitalOcean.

13.Veb tizimlarda real vaqt aloqasi . WebSocket

protokoli. Socket.IO kutubxonasi.

Real vaqt chat ilovasi misolida. Server-sent events (SSE). Long polling.

14. PWA

(Progressive Web Apps) . PWA tushunchasi. Service Worker. Web App

Manifest. Offline support (Cache

API). Push notification. PWA ning afzalliklari.

15. Veb

tizimlarni testlash va optimallashtirish . Test turlari: unit test,

integration test, end-to-end test. Jest, React Testing Library. Lighthouse –

performance, accessibility, SEO. Core Web Vitals. Optimallashtirish usullari (lazy loading,

code splitting, caching).

 





































































