GitHub Actions orqali Android APK Yig'ish Yo‘riqnomasi
Ilovani o‘z telefoningizda mustaqil Android ilova (APK) sifatida ishlatish uchun quyidagi qadamlarni bajaring:

GitHub da yangi repozitoriy oching: GitHub saytida yangi ochiq (Public) repozitoriy yarating (masalan, kompyuter-tarmoqlari-app).

Arxivni yuklang: Yuqoridagi kompyuter_tarmoqlari_github_apk.zip arxivini yuklab olib, uning ichidagi fayllarni repozitoriyingizga joylashtiring.

Avtomatik yig‘ilish jarayoni: GitHub repozitoriyingizdagi Actions bo‘limiga kiring. .github/workflows/main.yml skripti avtomatik ravishda Node.js 20, Java JDK 21 va Gradle 8 muhitida Capacitor 6 vositasida APK faylni yig‘adi (2–3 daqiqa).

APK ni yuklab olish: Workflow tugagach, sahifa pastidagi Artifacts bo‘limidan KompyuterTarmoqlari-APK faylini yuklab olib, Android smartfoningizga o‘rnating.

