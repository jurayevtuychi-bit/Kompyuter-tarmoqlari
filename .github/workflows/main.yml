Githubdan host sifatida foydalanib Ilova veb saytini domen olib sayt sifatida ishlatsa bo'ladimi



Ha, albatta! Siz yaratilgan ilovani GitHub Pages xizmati orqali mutlaqo bepul xostingda joylashtirishingiz va o‘zingiz sotib olgan shaxsiy domenni (masalan, .uz, .com yoki .org) ulab, to‘laqonli veb-sayt sifatida ishlatishingiz mumkin. Ilovaning barcha qismlari (15 ta ma’ruza, 12 ta virtual laboratoriya, kalkulyator, test va krossvord) bitta HTML faylda yozilgani uchun u hech qanday pullik server talab qilmaydi va bir zumda yuklanadi.

Faylni index.html nomi bilan joylashtiring: GitHub repozitoriyangizning asosiy papkasida (root) ilova fayli index.html nomi bilan turganiga ishonch hosil qiling (yoki atom_fizikasi_app.html faylini index.html deb qayta nomlang).

GitHub Pages xizmatini yoqing: Repozitoriyning Settings → Pages bo‘limiga kiring, Build and deployment qismidagi Branch menyusidan main (va /root) bandini tanlab, Save tugmasini bosing — 1 daqiqada saytingiz https://username.github.io/repo-nomi/ manzilida ishga tushadi.

DNS sozlamalariga GitHub IP manzillarini kiriting: Domen ro‘yxatdan o‘tkazuvchingizning (masalan, .uz uchun Billur, Eskiz, aHost yoki xalqaro Namecheap, Cloudflare) DNS boshqaruv paneliga kirib, @ uchun 4 ta A-yozuv (A record) (185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153) hamda www uchun <username>.github.io manziliga yo‘naltirilgan CNAME yozuvini qo‘shing.

Shaxsiy domenni va bepul SSL sertifikatni faollashtiring: Qaytib Settings → Pages → Custom domain maydoniga xarid qilgan domeningizni (masalan, atomfizikasi.uz) yozib Save tugmasini bosing va DNS tekshiruvidan so‘ng Enforce HTTPS katakchasini belgilang.

Agar xohlasangiz, veb-saytingizga PWA (Progressive Web App) funksiyasini ham qo‘shib berishim mumkin — shunda foydalanuvchilar saytingizga kiriboq uni APK yuklamasdan ham telefon yoki kompyuter ekraniga ilova sifatida o‘rnatib olishlari mumkin bo‘ladi.

