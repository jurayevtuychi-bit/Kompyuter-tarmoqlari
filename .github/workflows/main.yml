12-mavzu: Veb tizimlarni joylashtirish (Deployment), VPS, Cloud, Muhit o'zgaruvchilari (.env), CI/CD (GitHub Actions), Docker, Vercel, AWS.

Modul 6 Testi: 5 ta savol


(100% to'planganda 7-modul ochiladi)

VII Modul	Real vaqt aloqasi va PWA	
13-mavzu: Veb tizimlarda real vaqt aloqasi, WebSocket protokoli, Socket.IO kutubxonasi, Real vaqt chat, SSE, Long polling.


14-mavzu: PWA (Progressive Web Apps), Service Worker hayot sikli, Web App Manifest, Cache API oflayn qo'llab-quvvatlash, Push notification.

Modul 7 Testi: 5 ta savol


(100% to'planganda 8-modul ochiladi)

VIII Modul	Testlash, Optimallashtirish va Loyihalar	
15-mavzu: Veb tizimlarni testlash va optimallashtirish, Unit/Integration/E2E testlar, Jest, React Testing Library, Lighthouse, Core Web Vitals (LCP, INP, CLS), Lazy loading.


+ 5 ta Mustaqil Amaliy Muhandislik Loyihasi.

Modul 8 Testi: 5 ta savol


(100% to'planganda Yakuniy Nazorat ochiladi)

🔒 Qat'iy O'quv Ketma-Ketligi va Test Sinovlari
Siz belgilagan qoida asosida ilovada qat'iy tekshiruv algoritmi o'rnatildi:

Interfaol Test Joylashuvi: Har bir modulning oxirgi mavzusidan so'ng alohida interfaol test bloki joylashtirilgan.

100% Bloklash Sharti:

1-modul testidan 100% (5/5) olmaguncha 2-modul qulflangan bo'ladi;

2-modul testidan 100% olmaguncha 3-modul ochilmaydi;

Ushbu tartib 8-modulgacha qat'iy davom etadi;

8-modul testidan 100% o'tgandan so'ngгина Yakuniy Nazorat Testi (15 ta savol) ochiladi.

Agar talaba qulflangan modul yoki testga kirishga urinsa, maxsus ogohlantiruvchi oyna chiqib, qaysi modulni 100% yakunlash kerakligini tushuntiradi.

👤 Shaxsiy Kabinet va 🎓 Rasmiy Sertifikat
Foydalanuvchi Shaxsiy Kabineti:

Talaba ismi, familiyasi, OTM nomi, akademik guruhi va talaba ID raqami kiritiladi;

9 ta bosqich (8 ta modul testi + Yakuniy nazorat) bo'yicha to'liq monitoring paneli;

Natijalar brauzerning localStorage xotirasida avtomatik saqlanib boradi.

Akademik Malaka Sertifikati:

Barcha 8 ta modul va Yakuniy Nazorat Testi 100% A'lo natijaga erishilganda ochiladi;

Oltin hoshiyali, rasmiy gerb, unikal verifikatsiya ID kodi, sana, muhr va QR-kod bilan ta'minlangan;

HTML5 Canvas orqali yuqori aniqlikdagi PNG formatida yuklab olish va bevosita Chop etish (Print) tugmalari mavjud.

🧪 12 ta Interaktiv Virtual Laboratoriya
Laboratoriya bo'limida nazariyani amalda mustahkamlovchi 12 ta to'liq simulyator mavjud:

HTTP So'rov va Javob Simulyatori: GET, POST, PUT, DELETE metodlari, sarlavhalar va tarmoq kechikishini (RTT) hisoblash.

HTML5 Semantikasi va Forma Validatori: ValidityState ob'ektini real vaqtda tekshirish va Regex filtrlash.

CSS3 Flexbox va Grid Studiyasi: justify-content, align-items va grid-template-columns (fr) parametrlarini jonli boshqarish.

JS Event Loop Simulyatori: Call Stack, Web APIs, Microtasks (Promise) va Macrotasks navbatlarining o'zaro ishlashi.

React Lifecycle va VDOM Diffing: Holat o'zgarganda faqat o'zgargan tugunlar qayta chizilishini kuzatish.

Express Middleware Konveyeri: So'rovning oraliq filtrlar (logger, bodyParser, auth, router) orqali o'tishi.

SQL & Mongo Inspektori: Relyatsion SQL jadvallaridagi JOIN tezligi va NoSQL MongoDB BSON hujjatlarini o'qish qiyosi.

REST vs GraphQL Studiyasi: REST dagi Over-fetching muammosi va GraphQL ning tejamkor yagona endpoint so'rovi.

JWT Token Debugger: Header, Payload va Signature qismlarining HMAC-SHA256 orqali kodlanishi va verifikatsiyasi.

Web Security Lab: SQL Injection va XSS hujumlarini modellashtirish hamda DOMPurify tozalash mexanizmi.

WebSocket Chat Simulyatori: Ikki tomonlama (Full-Duplex) doimiy ochiq TCP kanal orqali 0–2 ms kechikishli xabarlar oqimi.

PWA Offline & Cache Studiyasi: Cache First va Network First strategiyalarida internet uzilganda ham ilovaning ishlashi.

📱 Mobil Ilova Dizayni va Sozlamalari
Oq-havorang (White-Cyan) Fon: Siz yuborgan naqshli tasvir asosidagi nafis geometrik spirograf va muzdek havorang gradient uyg'unligi.

Shrift O'lchamini Tanlash: Yuqori sarlavhada A- (85%), A (100%), A+ (115%) va A++ (130%) tugmalari joylashtirilgan bo'lib, butun sahifa matnlari mutanosib kattalashadi.

Mobil Navigatsiya: Smartfonlarda bir qo'l bilan boshqarishga qulay 5 ta asosiy bo'limli pastki menyu (Asosiy, Nazariya, 12 Lab, Loyihalar, Nazorat).

📦 GitHub Actions orqali APK Faylni Yig'ish Bosqichlari:
Yuklab olingan veb_tizimlari_github_apk.zip faylida Capacitor 6 va Android SDK to'plami tayyorlangan:

GitHub hisobingizda yangi repozitoriy oching (masalan: veb-tizimlari-app);

Arxiv ichidagi barcha fayllarni (www/, .github/workflows/main.yml, package.json, capacitor.config.json) repozitoriyingizga yuklang (git push);

Repozitoriyning Actions bo'limida Build Android APK jarayoni avtomatik ishga tushadi (Ubuntu muhitida Java 21 va Gradle 8 orqali);

Yig'ish yakunlangach, Artifacts bo'limidan tayyor VebTizimlari-APK.zip faylini yuklab olib, Android qurilmangizga o'rnatishingiz mumkin.

main yml yozib ber







GitHub Actions orqali "Veb tizimlari" ilovasidan avtomatik ravishda Android APK faylini yig‘ib beruvchi to‘liq .github/workflows/main.yml kodi:

YAML
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK 21 o'rnatish (Capacitor 6+ va Gradle 8 uchun)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web fayllarni (www/index.html) tayyorlash
        run: |
          mkdir -p www
          if [ -f "veb_tizimlari_app.html" ] && [ ! -f "www/index.html" ]; then
            cp veb_tizimlari_app.html www/index.html
          elif [ -f "atom_fizikasi_app.html" ] && [ ! -f "www/index.html" ]; then
            cp atom_fizikasi_app.html www/index.html
          elif [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          ls -la www/

      - name: package.json va capacitor.config.json yaratish
        run: |
          cat << 'EOF' > package.json
          {
            "name": "veb-tizimlari-pro",
            "version": "2.0.0",
            "description": "Veb Tizimlari - Interaktiv Mobil Ilova",
            "main": "www/index.html",
            "scripts": {
              "build": "echo 'Static build ready'"
            },
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "uz.oliytalim.vebtizimlari",
            "appName": "Veb Tizimlari",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Capacitor va Android platformani o'rnatish
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Gradle orqali APK faylni yig'ish (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tayyor APK faylni Artifacts bo'limiga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: VebTizimlari-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
GitHub'da ishlatish bo‘yicha qo‘llanma:
Fayl joylashuvi: GitHub repozitoriyangiz ildizida .github/workflows/ nomli papka oching va ichiga main.yml nomli fayl yaratib, yuqoridagi kodni joylashtiring.

Repozitoriy tarkibi: Asosiy katalogda faqat veb_tizimlari_app.html (yoki index.html) faylingiz bo‘lishi kifoya. Workflow ishga tushganda www papkasini, package.json hamda capacitor.config.json konfiguratsiyasini avtomatik sozlab oladi.

Avtomatik yig‘ish (Build): Har safar main yoki master tarmog‘iga yangilanish yuborganingizda (git push), GitHub Actions avtomatik ravishda virtual Ubuntu serverida Android muhitini yaratib, APK faylni yig‘adi.

APK ni yuklab olish:

Repozitoriyangizning Actions bo‘limiga o‘ting.

Eng oxirgi ishga tushgan Build Android APK jarayonini oching.

Sahifa pastki qismidagi Artifacts bo‘limidan VebTizimlari-APK faylini yuklab olib, to‘g‘ridan-to‘g‘ri Android telefoningizga o‘rnating.

